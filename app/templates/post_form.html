{% extends 'base.html' %}{% block title %}{{ 'Edit' if post else 'Create' }} Post — BlogSphere{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-9"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">{{ 'Edit Post' if post else 'Create a New Post' }}</h1><form method="post"><label class="form-label">Title</label><input class="form-control form-control-lg mb-3" name="title" maxlength="200" value="{{ post.title if post else '' }}" required><label class="form-label">Content</label><textarea class="form-control mb-3" name="content" rows="12" maxlength="20000" required>{{ post.content if post else '' }}</textarea><button class="btn btn-primary">{{ 'Save Changes' if post else 'Publish Post' }}</button></form></div></div></div></div>{% endblock %}
